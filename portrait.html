<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портрет для Кисы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --text: #f4f1ea;
      --text-muted: #9c958c;
      --accent: #c9a87c;
      --rose: #e8b4b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(201,168,124,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 70% 70%, rgba(232,180,184,0.05) 0%, transparent 50%);
    }

    .content {
      position: relative; z-index: 5;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 24px 60px;
      width: 100%; max-width: 560px;
      min-height: 100vh;
      justify-content: center;
    }

    .label {
      font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--accent); font-weight: 500; margin-bottom: 18px;
      opacity: 0; animation: fadeUp 0.9s ease 0.2s forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      font-weight: 400; font-style: italic;
      margin-bottom: 8px; text-align: center;
      opacity: 0; animation: fadeUp 1s ease 0.35s forwards;
    }

    .hint {
      font-size: 0.85rem; color: var(--text-muted); font-weight: 300;
      margin-bottom: 36px; text-align: center;
      opacity: 0; animation: fadeUp 1s ease 0.5s forwards;
    }

    .portrait-wrap {
      position: relative;
      width: min(92vw, 520px);
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 1s ease 0.7s forwards;
    }

    #heartCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border-radius: 20px;
    }

    .portrait-glow {
      position: absolute; inset: -1px;
      border-radius: 21px;
      border: 1px solid rgba(201,168,124,0.22);
      box-shadow: 0 0 50px rgba(201,168,124,0.1);
      pointer-events: none;
    }

    .mercedes-badge {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      z-index: 5;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards, badgeShine 4s ease-in-out infinite 2s;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.45));
      pointer-events: none;
    }
    .mercedes-badge img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    @keyframes badgeShine {
      0%, 100% { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.45)) brightness(1); }
      50% { filter: drop-shadow(0 2px 12px rgba(201,168,124,0.35)) brightness(1.15); }
    }

    .controls {
      margin-top: 40px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      opacity: 0; animation: fadeUp 1s ease 1s forwards;
    }

    .btn {
      background: var(--accent); color: #0c0c0e;
      border: none; padding: 14px 32px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-radius: 100px; cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #d4b48a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,168,124,0.3);
    }
    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-ghost:hover {
      color: var(--accent); border-color: var(--accent);
      background: transparent; box-shadow: none;
    }

    .status {
      font-size: 0.8rem; color: var(--text-muted);
      font-weight: 300; min-height: 1.2em;
      transition: opacity 0.3s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .portrait-wrap { width: 92vw; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="content">
    <span class="label">Специально для тебя</span>
    <h1>Киса</h1>
    <p class="hint">Портрет из сердечек</p>

    <div class="portrait-wrap">
      <canvas id="heartCanvas"></canvas>
      <div class="portrait-glow"></div>
      <div class="mercedes-badge">
        <img src="mercedes.png" alt="Mercedes">
      </div>
    </div>

    <div class="controls">
      <p class="status" id="status">Собираю портрет…</p>
      <button class="btn" id="btnReplay" style="display:none;">Собрать ещё раз</button>
      <a href="kisa.html" class="btn btn-ghost">Вернуться</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('sourceImg');
    const statusEl = document.getElementById('status');
    const btnReplay = document.getElementById('btnReplay');

    let particles = [];
    let animating = false;
    let size = 0;

    // Soft color palette for hearts (based on image + romantic tones)
    const heartColors = [
      '#e8b4b8', '#f2c4c8', '#c9a87c', '#d4b48a',
      '#f0d0d4', '#e0c0a0', '#ffb6c1', '#dda0a8',
      '#c9a87c', '#e8b4b8', '#f5d0d4', '#d4a5a5'
    ];

    function resize() {
      const wrap = canvas.parentElement;
      size = Math.floor(wrap.clientWidth);
      canvas.width = size;
      canvas.height = size;
    }
    resize();
    window.addEventListener('resize', () => {
      if (!animating) {
        resize();
        if (particles.length) drawFinal();
      }
    });

    class HeartParticle {
      constructor(tx, ty, color) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 80 + Math.random() * 140; // closer start = faster arrival
        this.x = tx + Math.cos(angle) * dist;
        this.y = ty + Math.sin(angle) * dist;
        this.tx = tx;
        this.ty = ty;
        this.color = color;
        this.size = 3.2 + Math.random() * 2.2; // smaller for denser sharper fill
        this.ease = 0.09 + Math.random() * 0.07; // much faster movement
        this.arrived = false;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.04 + Math.random() * 0.03;
      }

      update() {
        this.x += (this.tx - this.x) * this.ease;
        this.y += (this.ty - this.y) * this.ease;
        this.wobble += this.wobbleSpeed;

        if (Math.abs(this.tx - this.x) < 1.2 && Math.abs(this.ty - this.y) < 1.2) {
          this.arrived = true;
          this.x = this.tx;
          this.y = this.ty;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        // slight breathing when arrived
        const s = this.arrived ? this.size * (1 + Math.sin(this.wobble) * 0.06) : this.size;
        ctx.fillStyle = this.color;
        ctx.font = s + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.92;
        ctx.fillText('♥', 0, 0);
        ctx.restore();
      }
    }

    function buildFromImage() {
      resize();
      const step = 4; // even denser for sharper image

      const tmp = document.createElement('canvas');
      tmp.width = size;
      tmp.height = size;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0, size, size);

      let data;
      try {
        data = tctx.getImageData(0, 0, size, size).data;
      } catch (err) {
        statusEl.textContent = 'Ошибка загрузки фото';
        console.error(err);
        return;
      }

      particles = [];
      for (let y = 0; y < size; y += step) {
        for (let x = 0; x < size; x += step) {
          const i = (y * size + x) * 4;
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 60) continue;

          const brightness = (r + g + b) / 3;
          if (brightness < 18) continue;

          // Black & white: map brightness to grayscale
          const gray = Math.min(255, Math.floor(brightness * 1.05 + 15));
          const color = `rgb(${gray},${gray},${gray})`;

          particles.push(new HeartParticle(x + step/2, y + step/2, color));
        }
      }

      if (particles.length === 0) {
        statusEl.textContent = 'Не удалось создать частицы';
        return;
      }

      for (let i = particles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [particles[i], particles[j]] = [particles[j], particles[i]];
      }
    }

    function startAssemble() {
      if (animating) return;
      animating = true;
      statusEl.textContent = 'Собираю портрет…';
      btnReplay.style.display = 'none';

      buildFromImage();
      requestAnimationFrame(loop);
    }

    function loop() {
      ctx.clearRect(0, 0, size, size);
      let allArrived = true;

      particles.forEach(p => {
        p.update();
        p.draw();
        if (!p.arrived) allArrived = false;
      });

      if (!allArrived) {
        requestAnimationFrame(loop);
      } else {
        animating = false;
        statusEl.textContent = 'Готово';
        btnReplay.style.display = 'inline-block';
        // gentle continuous subtle pulse after assembly
        requestAnimationFrame(idlePulse);
      }
    }

    function idlePulse() {
      if (animating) return;
      ctx.clearRect(0, 0, size, size);
      particles.forEach(p => {
        p.wobble += p.wobbleSpeed;
        p.draw();
      });
      requestAnimationFrame(idlePulse);
    }

    function drawFinal() {
      ctx.clearRect(0, 0, size, size);
      particles.forEach(p => p.draw());
    }

    btnReplay.addEventListener('click', () => {
      animating = false;
      startAssemble();
    });

    // Start when image is ready
    function tryStart() {
      if (img.complete && img.naturalWidth > 0) {
        setTimeout(startAssemble, 300);
      } else {
        img.onload = () => setTimeout(startAssemble, 300);
        img.onerror = () => {
          statusEl.textContent = 'Не удалось загрузить фото';
        };
        // fallback in case onload already fired
        setTimeout(() => {
          if (!animating && particles.length === 0 && img.naturalWidth > 0) {
            startAssemble();
          }
        }, 800);
      }
    }
    tryStart();
  </script>
